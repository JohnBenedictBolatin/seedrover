name: seedrover
description: "SeedRover mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^2.6.1
  go_router: ^16.1.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.15.2
  url_launcher: ^6.3.2
  flutter_blue_plus: 2.2.1
  mjpeg_view: ^1.0.1
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/mascots/
    - assets/images/crops/
    - assets/images/stocks/
  fonts:
    - family: Karla
      fonts:
        - asset: assets/fonts/Karla-Variable.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
