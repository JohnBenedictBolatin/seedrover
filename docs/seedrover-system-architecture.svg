<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title desc">
  <title id="title">SeedRover system architecture</title>
  <desc id="desc">Repository-verified overview of SeedRover users, Flutter mobile app, Next.js web admin hosted on Vercel, Supabase services, external providers, and the locally controlled ESP32 rover and camera.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#526171"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#138a62"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#2478b8"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17212b}.title{font-size:34px;font-weight:750;letter-spacing:.4px}.sub{font-size:15px;fill:#536273}.section{font-size:19px;font-weight:700}.label{font-size:15px;font-weight:700}.body{font-size:13px;fill:#344353}.small{font-size:11.5px;fill:#536273}.tiny{font-size:10.5px;fill:#536273}.card{fill:#fff;stroke:#cbd5df;stroke-width:1.5}.line{fill:none;stroke:#526171;stroke-width:2.2;marker-end:url(#arrow)}.lineBoth{fill:none;stroke:#526171;stroke-width:2.2;marker-start:url(#arrow);marker-end:url(#arrow)}.cloudline{fill:none;stroke:#138a62;stroke-width:2.5;marker-end:url(#arrowGreen)}.cloudBoth{fill:none;stroke:#138a62;stroke-width:2.5;marker-start:url(#arrowGreen);marker-end:url(#arrowGreen)}.localline{fill:none;stroke:#2478b8;stroke-width:2.5;marker-end:url(#arrowBlue)}.localBoth{fill:none;stroke:#2478b8;stroke-width:2.5;marker-start:url(#arrowBlue);marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect width="1800" height="1420" fill="#f5f7fa"/>
  <text x="48" y="58" class="title">SEEDROVER · PRODUCT &amp; SYSTEM ARCHITECTURE</text>
  <text x="50" y="86" class="sub">Current implementation overview · verified against app, web portal, Supabase migrations/functions, and rover firmware</text>

  <!-- People -->
  <rect x="48" y="124" width="300" height="310" rx="14" class="card"/>
  <rect x="48" y="124" width="300" height="48" rx="14" fill="#e9eef4"/>
  <text x="70" y="155" class="section">PEOPLE &amp; ACCESS</text>
  <g transform="translate(72 196)" fill="none" stroke="#536273" stroke-width="2">
    <circle cx="20" cy="13" r="9"/><path d="M3 47c1-12 8-18 17-18s16 6 17 18z"/>
  </g>
  <text x="126" y="213" class="label">Farm owner / administrator</text>
  <text x="126" y="235" class="small">User administration, farm overview</text>
  <path d="M70 256h255" stroke="#e0e6ed"/>
  <g transform="translate(72 275)" fill="none" stroke="#138a62" stroke-width="2">
    <circle cx="20" cy="13" r="9"/><path d="M3 47c1-12 8-18 17-18s16 6 17 18z"/>
  </g>
  <text x="126" y="292" class="label">Planting manager / staff</text>
  <text x="126" y="314" class="small">Planting, rover, crop care</text>
  <path d="M70 334h255" stroke="#e0e6ed"/>
  <g transform="translate(72 350)" fill="none" stroke="#c17b1a" stroke-width="2">
    <circle cx="20" cy="13" r="9"/><path d="M3 47c1-12 8-18 17-18s16 6 17 18z"/>
  </g>
  <text x="126" y="367" class="label">Inventory manager / staff</text>
  <text x="126" y="389" class="small">Stock, sales, customer workflows</text>
  <text x="70" y="416" class="tiny">Access is permission- and role-scoped.</text>

  <!-- Apps -->
  <rect x="382" y="124" width="490" height="368" rx="14" class="card"/>
  <rect x="382" y="124" width="490" height="48" rx="14" fill="#e5f3ed"/>
  <g transform="translate(401 136)" fill="none" stroke="#138a62" stroke-width="2">
    <rect x="1" y="1" width="17" height="29" rx="3"/><path d="M6 5h7M7 25h5"/>
  </g>
  <text x="430" y="155" class="section">FLUTTER MOBILE APP</text>
  <text x="405" y="197" class="label">On-device features</text>
  <text x="405" y="222" class="body">Dashboard · Rover control · Camera view · Soil/sensor monitoring</text>
  <text x="405" y="245" class="body">Planting sessions · Crops · Stocks · Notifications · Profile · Rovie</text>
  <rect x="402" y="270" width="450" height="78" rx="9" fill="#f1f8f5" stroke="#b9ddcc"/>
  <text x="418" y="294" class="label">Rover control path (local)</text>
  <text x="418" y="316" class="small">Authenticated HTTP commands + sensor/status reads over rover Wi-Fi.</text>
  <text x="418" y="336" class="small">Planting receipt and calibration queue persist on phone; sync when online.</text>
  <rect x="402" y="363" width="450" height="98" rx="9" fill="#f7f8fa" stroke="#dce3e9"/>
  <text x="418" y="387" class="label">Cloud path (when internet is available)</text>
  <text x="418" y="410" class="small">Supabase Auth / data / Storage / Realtime; app also calls authenticated</text>
  <text x="418" y="430" class="small">Vercel weather endpoint. Local rover Wi-Fi has no internet by design.</text>
  <text x="418" y="450" class="small">Flutter has a BLE client; current rover firmware serves Wi-Fi HTTP only.</text>

  <rect x="382" y="518" width="490" height="310" rx="14" class="card"/>
  <rect x="382" y="518" width="490" height="48" rx="14" fill="#edf1f7"/>
  <g transform="translate(401 530)" fill="none" stroke="#344353" stroke-width="2">
    <rect x="1" y="2" width="25" height="19" rx="2"/><path d="M7 26h13M13 21v5M6 8h15"/>
  </g>
  <text x="439" y="549" class="section">WEB ADMIN · NEXT.JS ON VERCEL</text>
  <text x="405" y="592" class="label">Portal modules</text>
  <text x="405" y="617" class="body">Dashboard · Crops · Inventory · Sales · Customers · Investments</text>
  <text x="405" y="640" class="body">Crop outcomes · Notifications · Reports · Users · Activity log</text>
  <rect x="402" y="666" width="450" height="74" rx="9" fill="#f5f7fa" stroke="#dce3e9"/>
  <text x="418" y="691" class="label">Server-rendered portal + server actions / API routes</text>
  <text x="418" y="715" class="small">Uses Supabase Auth and permission checks for reads and writes.</text>
  <rect x="402" y="754" width="450" height="54" rx="9" fill="#fff8e9" stroke="#ebd69e"/>
  <text x="418" y="777" class="label">Rover Monitor is read-only</text>
  <text x="418" y="797" class="small">Shows cloud-stored status, sensor readings, and command history.</text>

  <!-- Supabase -->
  <rect x="914" y="124" width="512" height="704" rx="18" fill="#f0faf5" stroke="#6db996" stroke-width="2"/>
  <rect x="914" y="124" width="512" height="58" rx="18" fill="#d9f1e4"/>
  <g transform="translate(936 137)" fill="#138a62"><path d="M17 0 2 22h11l-2 16 16-23H15z"/></g>
  <text x="972" y="161" class="section">SUPABASE CLOUD BACKEND</text>
  <text x="941" y="207" class="small">Shared backend · accessed over HTTPS when clients have internet</text>
  <rect x="940" y="229" width="220" height="116" rx="11" class="card"/>
  <text x="958" y="256" class="label">Auth + permissions</text>
  <text x="958" y="280" class="small">Supabase Auth</text><text x="958" y="301" class="small">Profiles, roles, permissions</text><text x="958" y="322" class="small">PostgreSQL RLS policies</text>
  <rect x="1178" y="229" width="222" height="116" rx="11" class="card"/>
  <text x="1196" y="256" class="label">PostgreSQL data</text>
  <text x="1196" y="280" class="small">Crops, planting, stock &amp; sales</text><text x="1196" y="301" class="small">Customers, activity, notifications</text><text x="1196" y="322" class="small">Rover status, commands, sensors</text>
  <rect x="940" y="359" width="220" height="103" rx="11" class="card"/>
  <text x="958" y="386" class="label">Storage</text>
  <text x="958" y="410" class="small">Profile, crop, stock images</text><text x="958" y="431" class="small">Expense / payment receipts</text><text x="958" y="451" class="tiny">Private objects with access policies</text>
  <rect x="1178" y="359" width="222" height="103" rx="11" class="card"/>
  <text x="1196" y="386" class="label">Realtime + database</text>
  <text x="1196" y="410" class="small">Client subscriptions to selected</text><text x="1196" y="431" class="small">tables and change notifications</text><text x="1196" y="451" class="tiny">Postgres functions / triggers</text>
  <rect x="940" y="477" width="460" height="171" rx="11" fill="#fff" stroke="#a8d5bc" stroke-width="1.3"/>
  <text x="958" y="505" class="label">Supabase Edge Functions + scheduled jobs</text>
  <text x="958" y="530" class="small">crop-monitor · hourly crop-care evaluation + weather aggregation</text>
  <text x="958" y="552" class="small">assistant · Rovie context / Gemini requests</text>
  <text x="958" y="574" class="small">push-notification · dispatches stored notifications through FCM</text>
  <text x="958" y="596" class="small">user-admin · privileged user creation / administration</text>
  <text x="958" y="618" class="small">rover-device · authenticated heartbeat / command-ack HTTP endpoint</text>
  <rect x="940" y="664" width="460" height="137" rx="11" fill="#fff7ea" stroke="#e3c47c" stroke-width="1.4"/>
  <text x="958" y="692" class="label">Rover cloud boundary</text>
  <text x="958" y="717" class="small">The repository includes a device-ingress function and rover tables, but</text>
  <text x="958" y="739" class="small">current ESP32 firmware does not call that endpoint. Current control, live</text>
  <text x="958" y="761" class="small">telemetry, and camera streaming are local; cloud monitor data can be stale.</text>
  <text x="958" y="784" class="tiny">Do not interpret cloud command history as a remote-control queue.</text>

  <!-- External providers -->
  <rect x="1468" y="124" width="284" height="704" rx="14" class="card"/>
  <rect x="1468" y="124" width="284" height="48" rx="14" fill="#eef1f5"/>
  <text x="1490" y="155" class="section">EXTERNAL SERVICES</text>
  <rect x="1488" y="192" width="244" height="116" rx="10" fill="#fff" stroke="#d6dee6"/>
  <circle cx="1512" cy="219" r="10" fill="#e8b841"/><path d="M1512 202v-5m0 44v-5m-17-17h-5m44 0h-5m-29-12-4-4m32 32-4-4m0-24 4-4m-32 32 4-4" stroke="#b98712" stroke-width="1.5"/>
  <text x="1532" y="224" class="label">WeatherAPI</text>
  <text x="1504" y="253" class="small">Vercel /api/weather fetches the</text><text x="1504" y="273" class="small">farm forecast for app + web UI.</text><text x="1504" y="293" class="tiny">Server-side key; authenticated route.</text>
  <rect x="1488" y="324" width="244" height="134" rx="10" fill="#fff" stroke="#d6dee6"/>
  <g transform="translate(1504 343)" fill="none" stroke="#3986b5" stroke-width="2"><path d="M2 22h33a8 8 0 0 0 0-16 12 12 0 0 0-22-2A9 9 0 0 0 2 22z"/></g>
  <text x="1550" y="363" class="label">Open-Meteo</text>
  <text x="1504" y="394" class="small">Hourly/current forecast consumed</text><text x="1504" y="414" class="small">by crop-monitor and stored in DB.</text><text x="1504" y="438" class="tiny">Used as fallback / hybrid input.</text>
  <rect x="1488" y="474" width="244" height="126" rx="10" fill="#fff" stroke="#d6dee6"/>
  <g transform="translate(1505 494)" fill="none" stroke="#138a62" stroke-width="2"><path d="M2 20c6-12 14-12 21 0 4 6 8 6 12 0M2 10c6-12 14-12 21 0"/></g>
  <text x="1550" y="513" class="label">PAGASA</text>
  <text x="1504" y="545" class="small">Optional tenday forecast input</text><text x="1504" y="565" class="small">for crop-monitor (token configured).</text><text x="1504" y="585" class="tiny">Open-Meteo fallback if unavailable.</text>
  <rect x="1488" y="616" width="244" height="88" rx="10" fill="#fff" stroke="#d6dee6"/>
  <text x="1504" y="644" class="label">Gemini</text><text x="1504" y="667" class="small">Rovie assistant via Edge Function</text><text x="1504" y="688" class="tiny">API key remains server-side.</text>
  <rect x="1488" y="720" width="244" height="84" rx="10" fill="#fff" stroke="#d6dee6"/>
  <text x="1504" y="748" class="label">Firebase Cloud Messaging</text><text x="1504" y="772" class="small">Push delivery to registered devices</text><text x="1504" y="792" class="tiny">Triggered from notification workflow.</text>

  <!-- Cloud data-flow arrows -->
  <path d="M872 279H908" class="cloudBoth"/><path d="M872 665H908" class="cloudBoth"/>
  <path d="M348 280H378" class="line"/>
  <path d="M348 374H366V680H378" class="line"/>
  <text x="875" y="264" class="tiny" text-anchor="middle">HTTPS</text>
  <text x="875" y="650" class="tiny" text-anchor="middle">HTTPS</text>
  <path d="M1427 531H1460" class="line"/><text x="1444" y="517" class="tiny" text-anchor="middle">Edge fetch</text>
  <path d="M1427 552H1450V537H1460" class="line"/>
  <path d="M1427 566H1445V659H1460" class="line"/>
  <path d="M1427 588H1455V762H1460" class="line"/>
  <path d="M852 704H892V105H1450V250H1460" class="line"/>
  <rect x="1055" y="89" width="198" height="28" rx="14" fill="#f5f7fa" stroke="#cbd5df"/>
  <text x="1154" y="108" class="tiny" text-anchor="middle">Vercel /api/weather</text>

  <!-- Local rover subsystem -->
  <rect x="48" y="894" width="1704" height="448" rx="18" fill="#eef6fb" stroke="#72a9cf" stroke-width="2"/>
  <rect x="48" y="894" width="1704" height="54" rx="18" fill="#dcecf7"/>
  <g transform="translate(70 907)" fill="none" stroke="#2478b8" stroke-width="2"><path d="M2 21h32l-3-13H8zM7 21v6m22-6v6M8 27h5m13 0h5"/><circle cx="12" cy="25" r="4" fill="#dcecf7"/><circle cx="27" cy="25" r="4" fill="#dcecf7"/></g>
  <text x="120" y="929" class="section">ON-SITE FIELD SYSTEM · LOCAL CONTROL / NO INTERNET REQUIRED</text>
  <rect x="80" y="978" width="490" height="324" rx="14" fill="#fff" stroke="#9bbfd8" stroke-width="1.5"/>
  <text x="104" y="1010" class="label">Flutter app ↔ SeedRover local network</text>
  <text x="104" y="1037" class="body">Wi-Fi SoftAP · SSID SeedRover-01 · ESP32 at 192.168.4.1</text>
  <text x="104" y="1063" class="small">Phone joins rover WPA2 hotspot; HTTP /health, /command, /sensors,</text>
  <text x="104" y="1083" class="small">/planting-status. Requests use shared token / X-Rover-Token.</text>
  <path d="M105 1105h438" stroke="#e0e6ed"/>
  <text x="104" y="1130" class="label">BLE status</text>
  <text x="104" y="1152" class="small">BLE client protocol exists in Flutter; the current planting firmware</text>
  <text x="104" y="1172" class="small">README specifies local Wi-Fi HTTP as the active hardware interface.</text>
  <rect x="104" y="1192" width="438" height="83" rx="9" fill="#fff8e9" stroke="#ebd69e"/>
  <text x="120" y="1217" class="small">Rover hotspot intentionally has no internet. Finished planting receipts</text>
  <text x="120" y="1238" class="small">are stored on the phone first, then synchronized to Supabase later.</text>
  <text x="120" y="1259" class="tiny">Cloud status / sensor records need an online sync source to be current.</text>

  <rect x="626" y="978" width="562" height="324" rx="14" fill="#fff" stroke="#9bbfd8" stroke-width="1.5"/>
  <text x="650" y="1010" class="label">SeedRover controller · ESP32</text>
  <text x="650" y="1037" class="small">Local command handling · planting state machine · safety stops</text>
  <path d="M650 1055h514" stroke="#e0e6ed"/>
  <text x="650" y="1081" class="label">Sensors &amp; feedback</text>
  <text x="650" y="1105" class="small">Soil ADC · DS18B20 soil temperature · DHT11 air temperature / humidity</text>
  <text x="650" y="1127" class="small">Front/rear HC-SR04 obstacle warnings · no wheel encoders (timed distance estimate)</text>
  <text x="650" y="1154" class="label">Actuation hardware</text>
  <text x="650" y="1178" class="small">Motor driver · soil-probe servo · seed-gate servo · rake servo</text>
  <rect x="650" y="1200" width="514" height="76" rx="9" fill="#f7f8fa" stroke="#dce3e9"/>
  <text x="666" y="1225" class="small">Planting result = commanded gate pulses, not confirmed seed count.</text>
  <text x="666" y="1247" class="small">Probe moisture % requires local calibration; sensor failures remain null.</text>
  <text x="666" y="1268" class="tiny">Camera is a separate ESP32-CAM module on this same rover network.</text>

  <rect x="1244" y="978" width="474" height="324" rx="14" fill="#fff" stroke="#9bbfd8" stroke-width="1.5"/>
  <g transform="translate(1270 1000)" fill="none" stroke="#2478b8" stroke-width="2"><rect x="0" y="3" width="32" height="23" rx="4"/><circle cx="16" cy="14.5" r="7"/><path d="M7 3l3-4h11l3 4"/></g>
  <text x="1315" y="1018" class="label">ESP32-CAM · separate camera board</text>
  <text x="1268" y="1050" class="body">Joins SeedRover-01 at 192.168.4.2 (static address)</text>
  <text x="1268" y="1075" class="small">Serves local MJPEG stream /stream, still frame /capture,</text>
  <text x="1268" y="1095" class="small">and /status. Flutter reads the stream directly over rover Wi-Fi.</text>
  <path d="M1268 1117h426" stroke="#e0e6ed"/>
  <text x="1268" y="1143" class="label">Seed dispenser + field operation</text>
  <text x="1268" y="1168" class="small">Operator supervises; emergency stop / lost control heartbeat</text>
  <text x="1268" y="1188" class="small">stops movement and closes/raises mechanisms.</text>
  <rect x="1268" y="1210" width="426" height="66" rx="9" fill="#eef6fb" stroke="#c4dce9"/>
  <text x="1284" y="1235" class="small">Local path: Mobile ⇄ ESP32 ⇄ sensors / motors</text>
  <text x="1284" y="1257" class="small">Mobile ⇄ ESP32-CAM stream · camera is not cloud-hosted</text>

  <!-- local paths from mobile to rover -->
  <path d="M625 493H888V860H322V970" class="localBoth"/>
  <rect x="360" y="844" width="268" height="31" rx="15" fill="#f5f7fa" stroke="#b5c6d2"/>
  <text x="494" y="865" class="small" text-anchor="middle">Local Wi-Fi HTTP · commands / telemetry</text>
  <path d="M570 1138H616" class="localBoth"/>
  <path d="M1188 1138H1234" class="localBoth"/>
  <text x="594" y="1125" class="tiny" text-anchor="middle">control</text>
  <text x="1211" y="1125" class="tiny" text-anchor="middle">same LAN</text>

  <!-- legends and accuracy note -->
  <path d="M70 1370h58" class="cloudline"/><text x="140" y="1375" class="small">Internet / cloud data path</text>
  <path d="M380 1370h58" class="localline"/><text x="450" y="1375" class="small">Local rover network path</text>
  <text x="760" y="1375" class="small">Diagram reflects checked-in implementation; dashed future or planned components are omitted.</text>
</svg>
