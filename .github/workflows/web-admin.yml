name: Web admin checks

on:
  push:
    paths:
      - "web-admin/**"
      - "supabase/**"
      - ".github/workflows/web-admin.yml"
  pull_request:
    paths:
      - "web-admin/**"
      - "supabase/**"
      - ".github/workflows/web-admin.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check tracked secrets
        run: npm run check:tracked-secrets

      - name: Lint and build
        run: npm run verify
